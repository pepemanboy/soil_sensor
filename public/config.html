<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>My plants — Config</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e6edf3;
    }
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .page-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      min-width: 0;
    }
    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .header-icon-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      text-decoration: none;
      padding: 0;
      min-height: 0;
      cursor: pointer;
    }
    .header-icon-btn:hover {
      background: #30363d;
      color: #e6edf3;
    }
    .header-icon-btn svg {
      width: 1.25rem;
      height: 1.25rem;
    }
    .save-footer {
      margin-bottom: 1rem;
    }
    .save-footer .save-btn {
      width: 100%;
    }
    .save-footer .ok:not([hidden]) {
      display: flex;
      justify-content: center;
      margin-top: 0.35rem;
      min-height: auto;
    }
    button {
      background: #238636;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 2.5rem;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.6; cursor: wait; }
    section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    section h2 {
      font-size: 1rem;
      margin: 0 0 0.75rem;
      font-weight: 600;
    }
    .field {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .field label { color: #8b949e; font-size: 0.875rem; }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .field input[type="number"] {
      width: 4.5rem;
      background: #0f1419;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      font-size: 0.875rem;
    }
    .hint { color: #8b949e; font-size: 0.8rem; margin: 0.25rem 0 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem 0.35rem;
      border-bottom: 1px solid #30363d;
      vertical-align: middle;
    }
    th { color: #8b949e; font-weight: 500; }
    tr:last-child td { border-bottom: 0; }
    .plant-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 0.35rem;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      margin-right: 0.35rem;
    }
    td input[type="number"] {
      width: 4rem;
      background: #0f1419;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.35rem 0.45rem;
    }
    .err {
      background: #3d1618;
      color: #f85149;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      white-space: pre-wrap;
    }
    .ok {
      color: #3fb950;
      font-size: 0.875rem;
      align-items: center;
      min-height: 2.5rem;
    }
    .ok:not([hidden]) {
      display: inline-flex;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Config</h1>
    <div class="header-actions">
      <a href="./" class="header-icon-btn" aria-label="My plants" title="My plants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 20h10"/>
          <path d="M12 20V8"/>
          <path d="M12 8c-2.5-3.5-7-3.5-7 1.5S9 14 12 16c3-2 7-4.5 7-6.5S14.5 4.5 12 8z"/>
        </svg>
      </a>
      <button type="button" id="logout" class="header-icon-btn" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="error" class="err" hidden></div>

  <section>
    <h2>Global</h2>
    <div class="field">
      <label for="low-battery">Low battery at or below</label>
      <input type="number" id="low-battery" min="0" max="100" step="1" /> %
    </div>
    <div class="field">
      <label for="default-moisture">Default low moisture below</label>
      <input type="number" id="default-moisture" min="0" max="100" step="1" required /> %
    </div>
    <p class="hint">Per-plant values override the default when set. Leave a plant blank to use the default.</p>
  </section>

  <section>
    <h2>Per-plant moisture</h2>
    <table>
      <thead>
        <tr>
          <th>Plant</th>
          <th>Moisture below %</th>
        </tr>
      </thead>
      <tbody id="plants"></tbody>
    </table>
  </section>

  <div class="save-footer">
    <button type="button" id="save" class="save-btn">Save</button>
    <span id="saved" class="ok" hidden>Saved</span>
  </div>
  <script src="./auth-guard.js"></script>
  <script src="./config.js" type="module"></script>
</body>
</html>
